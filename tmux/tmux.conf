# Prefix: Ctrl-a (press twice to send Ctrl-a to the shell)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Speed & behaviour
set -sg escape-time 0
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Splits/windows open in the current folder
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "reloaded"

# Move between panes with prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Minimal status bar (Tokyo Night colours)
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#565f89"
set -g status-left "#[fg=#7aa2f7]#S "
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[fg=#e0af68]PREFIX ,}#[fg=#565f89]#h"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#c0caf5,bold] #I:#W "
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#1a1b26,fg=#7aa2f7"
